server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BMS API proxy — forwards POST /bms-proxy to {x-target-url}/api/sql
    # Mirrors the behaviour of the Vite dev-server CORS proxy plugin.
    location = /bms-proxy {
        # Resolve dynamic hostnames taken from the x-target-url header.
        resolver 8.8.8.8 1.1.1.1 valid=30s;
        resolver_timeout 5s;

        # Build the full upstream URL: <bms_url>/api/sql
        set $bms_upstream "${http_x_target_url}/api/sql";

        proxy_pass $bms_upstream;

        # Forward auth + content-type; strip the custom routing header.
        proxy_set_header Authorization  $http_authorization;
        proxy_set_header Content-Type   "application/json";
        proxy_set_header Host           $proxy_host;
        proxy_set_header x-target-url   "";

        # Support HTTPS upstream targets (HOSxP servers use TLS).
        proxy_ssl_server_name on;
        proxy_ssl_verify      off;

        # Match app-level timeouts (30 s connect, 60 s read/send).
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
